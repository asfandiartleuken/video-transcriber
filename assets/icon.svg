<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="50%" stop-color="#312E81" />
      <stop offset="100%" stop-color="#4C1D95" />
    </linearGradient>

    <!-- Glass Glow -->
    <radialGradient id="centerGlow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#1E1B4B" stop-opacity="0" />
    </radialGradient>

    <!-- Microphone Body Gradient -->
    <linearGradient id="micGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#E0E7FF" />
      <stop offset="100%" stop-color="#C7D2FE" />
    </linearGradient>

    <!-- Wave & Accent Gradient -->
    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <!-- Play Badge Gradient -->
    <linearGradient id="playGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E" />
      <stop offset="100%" stop-color="#FB7185" />
    </linearGradient>

    <!-- Shadow filter -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0F0C29" flood-opacity="0.6" />
    </filter>
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="104" ry="104" fill="url(#bgGrad)" filter="url(#dropShadow)" />
  
  <!-- Subtle Inner Border -->
  <rect x="24" y="24" width="464" height="464" rx="104" ry="104" fill="url(#centerGlow)" stroke="#A5B4FC" stroke-opacity="0.25" stroke-width="3" />

  <!-- Equalizer / Sound Waves Behind Mic -->
  <g filter="url(#glowFilter)" opacity="0.95">
    <!-- Left Waves -->
    <rect x="76" y="216" width="16" height="80" rx="8" fill="url(#cyanPurple)" />
    <rect x="108" y="176" width="16" height="160" rx="8" fill="url(#cyanPurple)" />
    <rect x="140" y="140" width="16" height="232" rx="8" fill="url(#cyanPurple)" />
    <rect x="172" y="186" width="16" height="140" rx="8" fill="url(#cyanPurple)" />

    <!-- Right Waves -->
    <rect x="324" y="186" width="16" height="140" rx="8" fill="url(#cyanPurple)" />
    <rect x="356" y="140" width="16" height="232" rx="8" fill="url(#cyanPurple)" />
    <rect x="388" y="176" width="16" height="160" rx="8" fill="url(#cyanPurple)" />
    <rect x="420" y="216" width="16" height="80" rx="8" fill="url(#cyanPurple)" />
  </g>

  <!-- Central Microphone Element -->
  <g filter="url(#dropShadow)">
    <!-- Mic Capsule Inner Grid/Acoustic Lines -->
    <rect x="220" y="112" width="72" height="136" rx="36" fill="url(#micGrad)" />
    
    <!-- Decorative Mic Mesh Stripes -->
    <line x1="232" y1="156" x2="280" y2="156" stroke="#94A3B8" stroke-width="3" stroke-linecap="round" opacity="0.6" />
    <line x1="230" y1="172" x2="282" y2="172" stroke="#94A3B8" stroke-width="3" stroke-linecap="round" opacity="0.6" />
    <line x1="232" y1="188" x2="280" y2="188" stroke="#94A3B8" stroke-width="3" stroke-linecap="round" opacity="0.6" />

    <!-- U-Shape Cradle -->
    <path d="M 204 200 C 204 266, 308 266, 308 200" fill="none" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" />

    <!-- Mic Stem & Base -->
    <line x1="256" y1="262" x2="256" y2="318" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" />
    <line x1="220" y1="318" x2="292" y2="318" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" />
  </g>

  <!-- Video Play Badge (Bottom Right of Mic) -->
  <g filter="url(#dropShadow)">
    <circle cx="356" cy="344" r="44" fill="url(#playGrad)" stroke="#FFFFFF" stroke-width="5" />
    <!-- Play Triangle -->
    <polygon points="346,326 374,344 346,362" fill="#FFFFFF" />
  </g>

  <!-- Transcription Text Lines at the Bottom (Sound to Text) -->
  <g opacity="0.9">
    <!-- Line 1 -->
    <rect x="130" y="388" width="84" height="10" rx="5" fill="#38BDF8" />
    <rect x="226" y="388" width="56" height="10" rx="5" fill="#A78BFA" />
    
    <!-- Line 2 -->
    <rect x="150" y="412" width="110" height="10" rx="5" fill="#E0E7FF" opacity="0.75" />
    <rect x="272" y="412" width="44" height="10" rx="5" fill="#38BDF8" opacity="0.75" />
  </g>
</svg>
