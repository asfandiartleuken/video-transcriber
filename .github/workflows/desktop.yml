name: Desktop installers
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    tags: ['v[0-9]*']
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: Windows-x64
          - os: macos-15
            target: macOS-arm64
          - os: macos-15-intel
            target: macOS-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install CPU Torch on Windows
        if: runner.os == 'Windows'
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install Python dependencies
        run: python -m pip install -r requirements-build.txt pytest
      - name: Tests
        run: python -m pytest -q
      - name: Install macOS media tools
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Prepare native tools and notices
        run: python scripts/prepare_tools.py
      - name: Build application
        run: python scripts/build_desktop.py
      - name: Check packaged application
        run: |
          python - <<'PYTEST'
          import json, pathlib, subprocess, sys
          executable = pathlib.Path('dist/Video Transcriber/Video Transcriber.exe') if sys.platform == 'win32' else pathlib.Path('dist/Video Transcriber.app/Contents/MacOS/Video Transcriber')
          report = pathlib.Path('build/smoke-result.json').resolve()
          subprocess.run([str(executable.resolve()), '--smoke-test', str(report)], check=True, timeout=240)
          assert json.loads(report.read_text())['ok'] is True
          PYTEST
      - name: Create Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $compiler)) { choco install innosetup --no-progress -y }
          & $compiler packaging/windows.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify Windows installation
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP 'VideoTranscriber'
          $installer = (Resolve-Path 'release/*Setup.exe').Path
          $install = Start-Process $installer -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=$installDir") -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw 'Installation failed' }
          $report = Join-Path $env:RUNNER_TEMP 'installed-smoke.json'
          $app = Start-Process (Join-Path $installDir 'Video Transcriber.exe') -ArgumentList @('--smoke-test', $report) -Wait -PassThru
          if ($app.ExitCode -ne 0 -or !(Test-Path $report)) { throw 'Installed app check failed' }
          if (!((Get-Content $report | ConvertFrom-Json).ok)) { throw 'Installed app report failed' }
      - name: Create macOS disk image
        if: runner.os == 'macOS'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p build/dmg release
          ditto 'dist/Video Transcriber.app' 'build/dmg/Video Transcriber.app'
          ln -s /Applications build/dmg/Applications
          hdiutil create -volname 'Video Transcriber' -srcfolder build/dmg -ov -format UDZO "release/Video-Transcriber-$TARGET.dmg"
          hdiutil verify "release/Video-Transcriber-$TARGET.dmg"
      - name: Record checksums and dependencies
        run: |
          python -m pip freeze > release/build-dependencies.txt
          python - <<'PYCHECK'
          import hashlib, pathlib
          files = sorted(pathlib.Path('release').glob('*'))
          pathlib.Path('release/SHA256SUMS.txt').write_text(''.join(f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}\n' for p in files))
          PYCHECK
      - uses: actions/upload-artifact@v4
        with:
          name: Video-Transcriber-${{ matrix.target }}
          path: release/*
          if-no-files-found: error
          retention-days: 14
