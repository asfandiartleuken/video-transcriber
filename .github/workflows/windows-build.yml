name: windows-build

on:
  workflow_dispatch:
    inputs:
      version:
        description: "App version for installer"
        required: false
        default: "0.0.0-ci"

jobs:
  build:
    runs-on: windows-latest
    env:
      APP_VERSION: ${{ github.event.inputs.version || github.ref_name || '0.0.0-ci' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-build.txt

      - name: Ensure placeholder icon exists
        run: python assets/make_icon.py

      - name: Build portable (PyInstaller)
        run: powershell -ExecutionPolicy Bypass -File .\scripts\build_windows.ps1 -Clean -DownloadTools

      - name: Smoke test portable
        run: powershell -ExecutionPolicy Bypass -File .\scripts\smoke_windows.ps1 -ExePath dist\VideoTranscriber\VideoTranscriber.exe -TimeoutSeconds 5

      - name: Install Inno Setup
        run: choco install innosetup --yes

      - name: Build installer
        run: powershell -ExecutionPolicy Bypass -File .\scripts\make_installer.ps1 -Version $env:APP_VERSION

      - name: Pack portable zip
        run: |
          Compress-Archive -Path dist\VideoTranscriber\* -DestinationPath dist\VideoTranscriber-portable.zip

      - name: Upload portable
        uses: actions/upload-artifact@v4
        with:
          name: VideoTranscriber-portable-${{ env.APP_VERSION }}
          path: dist\VideoTranscriber-portable.zip

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: VideoTranscriber-installer-${{ env.APP_VERSION }}
          path: dist\VideoTranscriber-Setup-${{ env.APP_VERSION }}.exe
